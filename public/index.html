<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<!-- marked for markdown rendering -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f11;
    --surface: #18181b;
    --surface2: #27272a;
    --border: #3f3f46;
    --text: #fafafa;
    --text-muted: #a1a1aa;
    --accent: #6366f1;
    --accent-light: #818cf8;
    --user-bg: #6366f1;
    --ai-bg: #27272a;
    --radius: 14px;
    --font: 'Inter', system-ui, sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #a78bfa);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  header h1 { font-size: 15px; font-weight: 600; }
  header p  { font-size: 12px; color: var(--text-muted); }
  .status { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; margin-left: auto; box-shadow: 0 0 6px #22c55e88; }

  button.reset-btn {
    margin-left: 8px;
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  button.reset-btn:hover { border-color: var(--accent-light); color: var(--accent-light); }

  /* ── Messages ── */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scroll-behavior: smooth;
  }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .msg {
    display: flex;
    gap: 10px;
    max-width: 760px;
    width: 100%;
    animation: fadeUp 0.2s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .msg.user  { align-self: flex-end; flex-direction: row-reverse; }
  .msg.ai    { align-self: flex-start; }

  .msg-avatar {
    width: 30px; height: 30px; border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .msg.user .msg-avatar { background: var(--user-bg); }
  .msg.ai   .msg-avatar { background: linear-gradient(135deg, var(--accent), #a78bfa); }

  .bubble {
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.65;
    max-width: min(520px, 80vw);
    word-break: break-word;
  }
  .msg.user .bubble { background: var(--user-bg); border-bottom-right-radius: 4px; }
  .msg.ai   .bubble { background: var(--ai-bg); border-bottom-left-radius: 4px; border: 1px solid var(--border); }

  /* markdown inside bubbles */
  .bubble p  { margin-bottom: 0.5em; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble pre {
    background: #111113;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    overflow-x: auto;
    font-size: 13px;
    margin: 8px 0;
  }
  .bubble code { font-family: 'Fira Code', 'Cascadia Code', monospace; font-size: 13px; }
  .bubble :not(pre) > code { background: #111113; padding: 2px 5px; border-radius: 4px; }
  .bubble ul, .bubble ol { padding-left: 20px; margin: 6px 0; }
  .bubble li { margin-bottom: 3px; }
  .bubble strong { font-weight: 600; }
  .bubble a { color: var(--accent-light); }
  .bubble h1, .bubble h2, .bubble h3 { margin-bottom: 4px; font-size: 1em; font-weight: 600; }

  /* typing indicator */
  .typing .bubble { display: flex; align-items: center; gap: 5px; padding: 14px 18px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); animation: bounce 1.2s infinite; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,80%,100% { transform: scale(0.7); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }

  /* empty state */
  #empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
    padding: 32px;
    pointer-events: none;
  }
  #empty .icon { font-size: 40px; }
  #empty h2 { font-size: 20px; font-weight: 600; }
  #empty p { color: var(--text-muted); font-size: 14px; max-width: 300px; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; pointer-events: all; }
  .suggestion {
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 13px;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s;
    background: var(--surface);
  }
  .suggestion:hover { border-color: var(--accent-light); color: var(--accent-light); background: #6366f110; }

  /* ── Input bar ── */
  footer {
    padding: 14px 16px 20px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .input-row {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    max-width: 760px;
    margin: 0 auto;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 12px;
    transition: border-color 0.15s;
  }
  .input-row:focus-within { border-color: var(--accent); }

  #input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    resize: none;
    max-height: 140px;
    line-height: 1.5;
    min-height: 22px;
  }
  #input::placeholder { color: var(--text-muted); }

  #send {
    width: 34px; height: 34px;
    border-radius: 10px;
    background: var(--accent);
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, opacity 0.15s, transform 0.1s;
    color: #fff;
  }
  #send:hover:not(:disabled) { background: var(--accent-light); transform: scale(1.05); }
  #send:disabled { opacity: 0.4; cursor: default; }

  .footer-note { text-align: center; font-size: 11px; color: var(--text-muted); margin-top: 8px; }

  /* ── Responsive ── */
  @media (max-width: 500px) {
    #messages { padding: 16px 10px; }
    footer { padding: 10px 10px 16px; }
    .bubble { max-width: 90vw; }
  }
</style>
</head>
<body>

<header>
  <div class="avatar">✦</div>
  <div>
    <h1>AI Assistant</h1>
    <p>Powered by Claude</p>
  </div>
  <div class="status"></div>
  <button class="reset-btn" id="resetBtn">New chat</button>
</header>

<div id="messages">
  <div id="empty">
    <div class="icon">💬</div>
    <h2>How can I help?</h2>
    <p>Ask me anything — I'll do my best to give you a clear, helpful answer.</p>
    <div class="suggestions">
      <span class="suggestion">Explain quantum computing</span>
      <span class="suggestion">Write a Python function</span>
      <span class="suggestion">Suggest a recipe</span>
      <span class="suggestion">Help me brainstorm</span>
    </div>
  </div>
</div>

<footer>
  <div class="input-row">
    <textarea id="input" rows="1" placeholder="Message…" autofocus></textarea>
    <button id="send" title="Send">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
  <p class="footer-note">Responses are AI-generated and may not always be accurate.</p>
</footer>

<script>
  const messagesEl = document.getElementById('messages');
  const emptyEl    = document.getElementById('empty');
  const inputEl    = document.getElementById('input');
  const sendBtn    = document.getElementById('send');
  const resetBtn   = document.getElementById('resetBtn');

  // Unique session ID per browser tab
  const sessionId = crypto.randomUUID();

  marked.setOptions({ breaks: true, gfm: true });

  function hideEmpty() {
    if (emptyEl) emptyEl.style.display = 'none';
  }

  function addMessage(role, content, isTyping = false) {
    hideEmpty();
    const wrap = document.createElement('div');
    wrap.className = `msg ${role}`;

    const av = document.createElement('div');
    av.className = 'msg-avatar';
    av.textContent = role === 'user' ? '👤' : '✦';

    const bbl = document.createElement('div');
    bbl.className = 'bubble';

    if (isTyping) {
      wrap.classList.add('typing');
      bbl.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
    } else if (role === 'ai') {
      bbl.innerHTML = marked.parse(content);
    } else {
      bbl.textContent = content;
    }

    wrap.appendChild(av);
    wrap.appendChild(bbl);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return wrap;
  }

  function updateBubble(msgEl, content) {
    const bbl = msgEl.querySelector('.bubble');
    bbl.innerHTML = marked.parse(content);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function setLoading(on) {
    sendBtn.disabled = on;
    inputEl.disabled = on;
  }

  async function sendMessage(text) {
    text = text.trim();
    if (!text) return;

    addMessage('user', text);
    inputEl.value = '';
    autoResize();
    setLoading(true);

    const typingEl = addMessage('ai', '', true);

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, sessionId }),
      });
      const data = await res.json();

      if (data.error) {
        updateBubble(typingEl, `⚠️ ${data.error}`);
      } else {
        typingEl.classList.remove('typing');
        updateBubble(typingEl, data.reply);
      }
    } catch {
      updateBubble(typingEl, '⚠️ Network error. Please try again.');
    } finally {
      setLoading(false);
      inputEl.focus();
    }
  }

  // Auto-resize textarea
  function autoResize() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
  }
  inputEl.addEventListener('input', autoResize);

  // Send on Enter (Shift+Enter = newline)
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage(inputEl.value);
    }
  });

  sendBtn.addEventListener('click', () => sendMessage(inputEl.value));

  // Suggestions
  document.querySelectorAll('.suggestion').forEach(btn => {
    btn.addEventListener('click', () => sendMessage(btn.textContent));
  });

  // Reset
  resetBtn.addEventListener('click', async () => {
    await fetch('/api/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId }),
    }).catch(() => {});

    // Clear UI
    messagesEl.innerHTML = '';
    messagesEl.appendChild(emptyEl);
    emptyEl.style.display = '';
    inputEl.focus();
  });
</script>

</body>
</html>
